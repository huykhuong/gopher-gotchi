<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css">
    <style id="sprite-style"></style>
  </head>
  
  <body>
    <canvas id="weather-canvas"></canvas>
    <div class="card">
      <div class="bubble" id="bubble"></div>
      <div class="level-badge" id="level">LVL 1</div>
      <div class="sprite-wrap">
        <div class="aura" id="aura"></div>
        <div class="sprite" id="sprite"></div>
      </div>
      <div class="mood" id="mood">Happy</div>
      <div class="stats">
        <div class="stat-row">
          <span class="stat-label">Hunger</span>
          <div class="bar-track"><div class="bar-fill hunger" id="hunger-bar" style="width:0%"></div></div>
          <span class="stat-value" id="hunger-val">0%</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">CPU</span>
          <div class="bar-track"><div class="bar-fill cpu" id="cpu-bar" style="width:0%"></div></div>
          <span class="stat-value" id="cpu-val">0%</span>
        </div>
      </div>
      <div class="button-row">
        <div class="action-group">
          <div class="radial-menu" id="radial-menu">
            <button class="radial-item" data-action="gift"       title="Find a gift">🎁</button>
            <button class="radial-item" data-action="hug"        title="Hug Diana">💖</button>
            <button class="radial-item" data-action="joke"       title="Tell a joke">😂</button>
            <button class="radial-item" data-action="objectives" title="Show objectives">🎯</button>
          </div>
          <button class="action-btn" id="action-btn">Action</button>
        </div>
        <button class="quit-btn" id="quit-btn" onclick="quitApp().catch(()=>{})">Quit</button>
      </div>

      <!-- Objectives panel — shown when mission data arrives -->
      <div class="mission-panel" id="mission-panel">
        <div class="mission-header">
          <span class="mission-title">🎯 OBJECTIVES</span>
          <button class="mission-close" id="mission-close" title="Close">×</button>
        </div>
        <div class="mission-list" id="mission-list"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
